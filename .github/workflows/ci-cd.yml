name: Student Task Manager CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # =========================
  # 1. BUILD AND TEST
  # =========================
  test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run application tests
        run: python -m unittest test_app.py


  # =========================
  # 2. BUILD AND PUSH DOCKER
  # =========================
  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/student-task-manager:latest


  # =========================
  # 3. DEPLOY TO LOCAL PC
  # =========================
  deploy:
    name: Deploy to Local Computer
    needs: docker
    runs-on: self-hosted

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest Docker image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/student-task-manager:latest

      - name: Stop and remove old container
        shell: powershell
        run: |
          $existing = docker ps -a -q -f name=student-task-deployed

          if ($existing) {
            docker stop student-task-deployed
            docker rm student-task-deployed
          }

      - name: Deploy latest application
        run: docker run -d --name student-task-deployed -p 5000:5000 ${{ secrets.DOCKERHUB_USERNAME }}/student-task-manager:latest

      - name: Wait for application
        shell: powershell
        run: Start-Sleep -Seconds 5

      - name: Verify running container
        run: docker ps